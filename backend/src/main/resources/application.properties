########################################################################
# 백엔드 실행 설정
# DB 연결은 DB_URL·DB_USER·DB_PASSWORD 환경변수로 바꿀 수 있다. 기본값은 docker-compose.yml의 로컬 개발 DB다
# 스키마는 Flyway가 관리하고 JPA는 엔티티와 테이블이 맞는지 검증(validate)만 한다
########################################################################

spring.application.name=monitoring
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monitoring}
spring.datasource.username=${DB_USER:monitoring}
spring.datasource.password=${DB_PASSWORD:monitoring_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
