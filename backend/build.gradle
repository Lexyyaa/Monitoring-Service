/************************************************************************
 * 백엔드 Gradle 빌드 설정
 * Java 21, Spring Boot 3.5.16, Web·JPA(Hibernate)·Lombok·Flyway·PostgreSQL 의존성
 ************************************************************************/

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.ocs.monitoring'
version = '0.0.1-SNAPSHOT'
description = 'monitoring'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/************************************************************************
 * 테스트는 test 프로필로 실행해 개발 DB가 아닌 테스트 전용 DB(monitoring_test)에 접속한다
 ************************************************************************/
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
}

/************************************************************************
 * 코드 포매팅 (Spotless + palantir-java-format, 한 줄 최대 120자)
 * ./gradlew spotlessApply 로 정리하고, build(check) 시 spotlessCheck가 돌아 위반하면 빌드가 실패한다
 ************************************************************************/
spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.98.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
