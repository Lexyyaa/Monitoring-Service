########################################################################
# 로컬 실행용 Docker Compose
# db       : PostgreSQL 17. DB monitoring / 사용자 monitoring (로컬 개발 전용 계정), 데이터는 monitoring_pgdata 볼륨에 유지
#            빈 볼륨으로 처음 뜰 때 docker/db-init 의 SQL로 테스트 전용 DB monitoring_test 를 만든다
# backend  : Spring Boot API. 시작할 때 Flyway 로 스키마를 만든다
# frontend : nginx 가 빌드된 화면을 제공하고 /api 를 backend 로 전달한다
# docker compose up -d --wait db      → DB만 띄우고 로컬에서 bootRun·npm run dev
# docker compose up -d --build --wait → 세 서비스 전부 컨테이너로. 화면은 http://localhost:3000
# 포트가 겹치면 DB_PORT·BACKEND_PORT·FRONTEND_PORT 환경 변수로 바꾼다
########################################################################

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring_dev
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - monitoring_pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/monitoring
      DB_USER: monitoring
      DB_PASSWORD: monitoring_dev
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  monitoring_pgdata:
