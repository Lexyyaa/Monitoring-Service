########################################################################
# 프론트엔드 컨테이너의 nginx 설정
# 빌드한 정적 파일을 제공한다. 해시가 붙은 /assets/ 는 오래 캐시하고, index.html 은 매번 확인한다
# /api 는 백엔드 컨테이너로 전달해 브라우저가 같은 출처에서 화면과 API를 요청한다 (개발 서버의 Vite 프록시와 같은 역할)
# 백엔드 주소는 compose 네트워크의 서비스 이름(backend)이다
########################################################################

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 화면 라우팅 : 없는 경로는 index.html 로 되돌린다
    location / {
        try_files $uri /index.html;
    }
}
