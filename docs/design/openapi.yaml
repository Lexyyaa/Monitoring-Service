openapi: 3.1.0
info:
  title: Infrastructure Monitoring Service API
  version: 0.1.0
  description: |-
    Infrastructure Monitoring Service의 조회 API 계약.

    - 원본 리소스의 관계는 Cluster→Node, Cluster→Namespace→Pod, Pod→Node이다.
    - 화면 탐색 계층은 Cluster→Node→Namespace→Pod로 제공한다.
    - 실제 Kubernetes 연동 없이 PostgreSQL에 저장한 Mock 데이터를 조회한다.
    - 상태 판단 엔진, 하위 상태 개수 집계, 별도 갱신/명령 API는 제공하지 않는다.
    - API의 issueLevel은 이상 심각도이며 리소스 고유 상태(statusCode)와 다르다.

    설계 확정: Namespace는 여러 Node에 표시될 수 있다. 전체 검색에서는
    해당 Namespace의 Pod가 실행 중인 Node 중 ID가 가장 작은 Node를 대표 경로로 제공한다.
    초기 Mock 데이터에서 모든 Pod에는 Node가 배정되고, 각 Namespace는 최소 1개 Node에서 사용된다.
    DB는 Pod–Node/Namespace의 Cluster 일치 여부를 복합 외래 키로 보장한다.

    상태 필터는 '리소스 자체 일치 또는 일치하는 하위 리소스가 존재함'을 기준으로
    트리 경로를 유지한다. 이름 검색은 검색 결과 목록에 적용하고 트리의 이름 조건으로
    자동 전파하지 않는다.
servers:
  - url: /api/v1
    description: 애플리케이션 상대 경로

tags:
  - name: Tree
    description: Cluster→Node→Namespace→Pod 단계별 지연 조회
  - name: Resource
    description: 리소스 상세 조회
  - name: Search
    description: 전체 리소스 이름 검색 및 경로 반환

paths:
  /clusters:
    get:
      tags: [Tree]
      operationId: listClusters
      summary: 최초 Cluster 목록 조회
      description: |-
        직접 상위 계층인 Cluster 목록만 반환한다. 하위 Node/Namespace/Pod 목록은 포함하지 않는다.
        issueLevel이 지정되면 자체 이상 수준이 일치하거나, 하위 경로에 일치하는
        리소스가 있는 Cluster를 반환한다. 개수 집계는 하지 않는다.
      parameters:
        - $ref: '#/components/parameters/IssueFilter'
      responses:
        '200':
          description: Cluster 트리 항목
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /clusters/{clusterId}/nodes:
    get:
      tags: [Tree]
      operationId: listClusterNodes
      summary: Cluster의 직접 하위 Node 조회
      description: |-
        해당 Cluster의 Node 전체를 한 단계 조회한다. 필터가 있으면 Node 자체가
        일치하거나 Node에서 실행 중인 Pod 또는 그 Pod의 Namespace가 일치하는
        Node만 경로 유지 대상으로 포함한다.
      parameters:
        - $ref: '#/components/parameters/ClusterId'
        - $ref: '#/components/parameters/IssueFilter'
      responses:
        '200':
          description: Node 트리 항목
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /nodes/{nodeId}/namespaces:
    get:
      tags: [Tree]
      operationId: listNodeNamespaces
      summary: Node에서 사용 중인 Namespace 조회
      description: |-
        해당 Node에 Pod가 배정된 Namespace만 중복 없이 반환한다.
        Namespace의 실제 소속은 Cluster이며 Node의 자식으로 저장되는 것이 아니다.
        필터가 있으면 Namespace 자체가 일치하거나, 해당 Node와 Namespace에
        속하는 Pod 중 일치하는 것이 있을 때만 반환한다.
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IssueFilter'
      responses:
        '200':
          description: 해당 Node 맥락의 Namespace 트리 항목
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /nodes/{nodeId}/namespaces/{namespaceId}/pods:
    get:
      tags: [Tree]
      operationId: listNodeNamespacePods
      summary: Node와 Namespace에 해당하는 Pod 조회
      description: |-
        Node와 Namespace가 같은 Cluster에 속하고 해당 조합이 유효할 때
        두 ID에 모두 속하는 Pod의 요약 목록을 반환한다.
        현재 데이터 규모에서는 직접 자식 수가 약 50개로, 추가 페이지 없이 모두 반환한다.
        필터가 있으면 해당 issueLevel인 Pod만 반환한다.
        유효한 Node/Namespace 조합이지만 Pod가 없으면 빈 목록(200)을 반환한다.
        서로 다른 Cluster의 Node/Namespace 조합이면 404를 반환한다.
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/IssueFilter'
      responses:
        '200':
          description: Pod 트리 항목
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /resources/search:
    get:
      tags: [Search]
      operationId: searchResources
      summary: 모든 리소스의 이름 부분일치 검색
      description: |-
        모든 Cluster의 Cluster/Node/Namespace/Pod를 대상으로 이름 부분일치,
        대소문자 무시 검색을 수행한다. issueLevel과 이름 조건은 AND다.
        결과는 lower(name) ASC, resourceType ASC, id ASC 순으로 안정 정렬한다.
        페이지는 0부터 시작하며 매 페이지 최대 20건만 반환한다.
        totalCount 집계는 제공하지 않고 hasNext로 다음 페이지 존재 여부를 표시한다.

        검색 결과는 각 리소스의 전체 UI 탐색 경로를 포함한다. Namespace가 여러
        Node에 표시되면 Pod가 실행 중인 Node 중 ID가 가장 작은 경로를 사용한다.
        검색 시 필터를 적용하더라도 이 경로의 상위 리소스에 심각도를 강제로 전파하지 않는다.

        Frontend는 입력 후 300ms 디바운스를 적용하며 오래된 응답의 덮어쓰기를 막는다.
        이는 클라이언트 동작 규칙으로 서버 응답 지연에 300ms를 추가한다는 뜻은 아니다.
      parameters:
        - name: q
          in: query
          required: true
          description: 공백 제거 후 1글자 이상인 이름 검색어. 공백만 전달하면 400.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: api
        - $ref: '#/components/parameters/IssueFilter'
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호. 단순 구현을 위해 Offset 기반으로 시작한다.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: 검색 결과 20개 단위
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              examples:
                matchingPod:
                  summary: Pod 검색 결과 예시
                  value:
                    items:
                      - id: 10001
                        resourceType: POD
                        name: payment-api-01
                        statusCode: Running
                        issueLevel: ERROR
                        lastUpdatedAt: '2026-11-14T01:00:00Z'
                        path:
                          - { resourceType: CLUSTER, id: 1, name: cluster-prod }
                          - { resourceType: NODE, id: 11, name: node-gpu-01 }
                          - { resourceType: NAMESPACE, id: 105, name: payments }
                          - { resourceType: POD, id: 10001, name: payment-api-01 }
                    page: 0
                    pageSize: 20
                    hasNext: false
                    fetchedAt: '2026-11-14T01:00:10Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /resources/{resourceType}/{resourceId}:
    get:
      tags: [Resource]
      operationId: getResourceDetail
      summary: 타입별 리소스 상세 조회
      description: |-
        선택 리소스의 고유 속성, 공통 이상 심각도, 실제 상태 갱신 시각 및
        UI 탐색 경로를 반환한다. 하위 리소스 개수나 상태별 집계는 반환하지 않는다.

        Namespace 상세의 nodeId가 생략되면 전체 검색과 동일하게
        해당 Namespace의 Pod가 실행 중인 최소 ID Node를 대표 경로로 사용한다.
        트리에서 Namespace를 선택한 경우에는 현재 트리의 nodeId를 전달하여
        사용자가 선택했던 경로를 유지한다. 전달된 nodeId에 Pod가 배정되지
        않았거나 Namespace와 다른 Cluster에 속하면 404를 반환한다.
        nodeId는 NAMESPACE 이외의 resourceType에 사용할 수 없다.
      parameters:
        - $ref: '#/components/parameters/ResourceType'
        - $ref: '#/components/parameters/ResourceId'
        - name: nodeId
          in: query
          required: false
          description: NAMESPACE 상세 조회에만 허용되는 탐색 경로의 Node ID
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 리소스 상세 조회 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceDetailResponse' }
              examples:
                node:
                  summary: Node 상세 예시
                  value:
                    resource:
                      id: 11
                      resourceType: NODE
                      name: node-gpu-01
                      statusCode: Ready
                      issueLevel: WARNING
                      issueReason: DiskPressure 감지
                      lastUpdatedAt: '2026-11-14T01:00:00Z'
                      path:
                        - { resourceType: CLUSTER, id: 1, name: cluster-prod }
                        - { resourceType: NODE, id: 11, name: node-gpu-01 }
                      attributes:
                        readyCondition: 'True'
                        cpuUsagePercent: 72.5
                        memoryUsagePercent: 64.2
                        diskUsagePercent: 91.0
                    fetchedAt: '2026-11-14T01:00:10Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  parameters:
    IssueFilter:
      name: issueLevel
      in: query
      required: false
      description: |-
        이상 심각도 직접 일치 조건. 프론트의 ALL 선택은 파라미터 생략으로 표현한다.
        트리에서는 일치 리소스뿐 아니라 해당 리소스에 도달하는 경로도 반환한다.
      schema: { $ref: '#/components/schemas/IssueLevel' }
      example: ERROR
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    NamespaceId:
      name: namespaceId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ResourceType:
      name: resourceType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceType' }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  schemas:
    ResourceType:
      type: string
      enum: [CLUSTER, NODE, NAMESPACE, POD]
      description: 리소스 종류. ID는 종류와 묶어서 식별한다.

    IssueLevel:
      type: string
      enum: [NONE, WARNING, ERROR, UNKNOWN]
      description: 감지된 이상 수준. 오래된 데이터 여부는 이 값과 독립적이다.

    MatchRole:
      type: string
      enum: [MATCH, PATH]
      description: |-
        issueLevel 필터가 지정된 트리에서만 사용한다.
        MATCH는 항목 자체가 필터와 일치, PATH는 일치하는 하위 항목으로 가는 경로임을 뜻한다.

    PathSegment:
      type: object
      additionalProperties: false
      required: [resourceType, id, name]
      properties:
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }

    ResourceSummary:
      type: object
      required: [id, resourceType, name, statusCode, issueLevel, lastUpdatedAt]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        name: { type: string }
        statusCode:
          type: string
          description: 리소스별 고유 상태 코드. 클러스터/노드/네임스페이스/파드마다 의미가 다르다.
        issueLevel: { $ref: '#/components/schemas/IssueLevel' }
        lastUpdatedAt: { type: string, format: date-time }

    TreeItem:
      allOf:
        - $ref: '#/components/schemas/ResourceSummary'
        - type: object
          properties:
            matchRole: { $ref: '#/components/schemas/MatchRole' }
          description: 필터가 없는 요청에서는 matchRole을 생략한다.

    TreeListResponse:
      type: object
      additionalProperties: false
      required: [items, fetchedAt]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TreeItem' }
        fetchedAt:
          type: string
          format: date-time
          description: 이번 HTTP 조회의 서버 처리 시각. 개별 리소스 lastUpdatedAt과 별개다.

    SearchItem:
      allOf:
        - $ref: '#/components/schemas/ResourceSummary'
        - type: object
          required: [path]
          properties:
            path:
              type: array
              minItems: 1
              maxItems: 4
              items: { $ref: '#/components/schemas/PathSegment' }
              description: 이 결과를 선택했을 때 자동으로 펼칠 대표 UI 경로

    SearchResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, hasNext, fetchedAt]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SearchItem' }
        page: { type: integer, minimum: 0 }
        pageSize: { type: integer, const: 20 }
        hasNext: { type: boolean }
        fetchedAt: { type: string, format: date-time }

    ClusterAttributes:
      type: object
      additionalProperties: false
      required: [controlPlaneStatus]
      properties:
        controlPlaneStatus: { type: string }
        kubernetesVersion: { type: [string, 'null'] }

    NodeAttributes:
      type: object
      additionalProperties: false
      required: [readyCondition]
      properties:
        readyCondition:
          type: string
          enum: ['True', 'False', 'Unknown']
        cpuUsagePercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        memoryUsagePercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        diskUsagePercent: { type: [number, 'null'], minimum: 0, maximum: 100 }

    NamespaceAttributes:
      type: object
      additionalProperties: false
      required: [phase]
      properties:
        phase: { type: string, enum: [Active, Terminating] }
        cpuQuotaUsedMillicores: { type: [integer, 'null'], format: int64, minimum: 0 }
        cpuQuotaLimitMillicores: { type: [integer, 'null'], format: int64, minimum: 0 }
        memoryQuotaUsedMib: { type: [integer, 'null'], format: int64, minimum: 0 }
        memoryQuotaLimitMib: { type: [integer, 'null'], format: int64, minimum: 0 }

    PodAttributes:
      type: object
      additionalProperties: false
      required: [phase]
      properties:
        phase:
          type: string
          enum: [Pending, Running, Succeeded, Failed, Unknown]
        ready: { type: [boolean, 'null'] }
        restartCount: { type: integer, minimum: 0 }
        cpuUsageMillicores: { type: [integer, 'null'], format: int64, minimum: 0 }
        memoryUsageMib: { type: [integer, 'null'], format: int64, minimum: 0 }

    ResourceDetail:
      allOf:
        - $ref: '#/components/schemas/ResourceSummary'
        - type: object
          required: [issueReason, path, attributes]
          properties:
            issueReason: { type: [string, 'null'] }
            path:
              type: array
              minItems: 1
              maxItems: 4
              items: { $ref: '#/components/schemas/PathSegment' }
            attributes:
              description: 리소스 타입에 따라 해당 고유 필드 객체를 제공한다.
              oneOf:
                - $ref: '#/components/schemas/ClusterAttributes'
                - $ref: '#/components/schemas/NodeAttributes'
                - $ref: '#/components/schemas/NamespaceAttributes'
                - $ref: '#/components/schemas/PodAttributes'

    ResourceDetailResponse:
      type: object
      additionalProperties: false
      required: [resource, fetchedAt]
      properties:
        resource: { $ref: '#/components/schemas/ResourceDetail' }
        fetchedAt: { type: string, format: date-time }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Frontend이 안정적으로 분기할 오류 코드
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: 요청한 리소스를 찾을 수 없습니다.
        traceId:
          type: [string, 'null']
          description: 로그 상관관계용 추적 ID (사용 가능한 경우)

  responses:
    BadRequest:
      description: 입력 파라미터 또는 타입이 유효하지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: INVALID_PARAMETER, message: 요청 파라미터를 확인해 주세요. }
    NotFound:
      description: 리소스가 없거나 요청한 상하위 경로가 유효하지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: RESOURCE_NOT_FOUND, message: 해당 리소스 또는 경로를 찾을 수 없습니다. }
    InternalError:
      description: 예상하지 못한 서버 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: INTERNAL_ERROR, message: 요청을 처리하지 못했습니다. }
    ServiceUnavailable:
      description: DB 등 조회 의존 서비스 일시 불가
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: SERVICE_UNAVAILABLE, message: 데이터를 일시적으로 조회할 수 없습니다. }
